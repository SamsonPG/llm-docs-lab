# wrangler.toml — Cloudflare Worker configuration
#
# WHAT: Bindings and routes for the retrieval API.
# WHY:  Bindings rather than API tokens. A binding is granted by the platform at runtime,
#       so there is no key to store, rotate, or leak into a commit. This repo is public.
# WHEN: Read by `wrangler dev --remote` and `wrangler deploy`.
#
# TOML ORDERING MATTERS AND COST ME A DEPLOY.
# Every key after a [table] header belongs to that table until the next header. Appending
# `workers_dev` to the end of this file put it inside [observability], where wrangler
# reported it as an unexpected field and carried on — so the setting silently did nothing.
# Top-level keys live at the top, above every table.

name = "llm-docs-lab"
main = "src/worker.mjs"

# Set to 2026-08-24, not today: Cloudflare rejects a compatibility date in the future
# relative to ITS clock (UTC), and this machine had already rolled over to the 25th.
compatibility_date = "2026-08-24"

# Keep the workers.dev hostname serving alongside the custom domain.
#
# Adding a route silently disables workers.dev, which took the service offline for the
# minutes a new custom domain needs to propagate DNS and issue a certificate. Both are
# served now; only the custom domain is advertised.
workers_dev = true

# Custom domain, so the public URL is not derived from an email address.
#
# The account subdomain was samsonpg077.workers.dev, derived from the account email, which
# put a personal address into a link that goes on a CV. It is now acsaven.workers.dev, so
# the fallback reads as the studio too. This custom domain remains the advertised address;
# wrangler created its DNS record and existing acsaven.com records were untouched.
[[routes]]
pattern = "llmdocs.acsaven.com"
custom_domain = true

# One custom domain, plus workers.dev underneath it.
#
# A second custom domain on another zone was tried and removed. It guarded against a
# problem with acsaven.com specifically, which is the least likely failure here — and it
# put a lab project's hostname on an unrelated product's domain, which is worse than the
# small risk it covered. The workers.dev hostname stays enabled as the free fallback: it
# depends on no domain of mine at all, which is the failure actually worth insuring
# against.

# Workers AI — embeddings and generation.
[ai]
binding = "AI"

# Vectorize index. Dimensions must match the embedding model exactly and cannot be changed
# after creation, so 768 was measured from a live /probe call rather than assumed.
[[vectorize]]
binding = "VECTORIZE"
index_name = "llm-docs"

[observability]
enabled = true
